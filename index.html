<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Nahel </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #f8f7f7;
    --surface: #ffffff;
    --ink: #1f1a1b;
    --muted: #7a6f71;
    --line: #ebe5e6;
    --accent: #D2042D;
    --accent-dark: #a80324;
    --accent-soft: #fdebee;
    --shadow: 90, 20, 30;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #161112;
        --surface: #211a1c;
        --ink: #f3ecee;
        --muted: #a39598;
        --line: #362b2e;
        --accent: #e5223f;
        --accent-dark: #ff6b82;
        --accent-soft: #3a1a20;
    }
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
}
.container {
    width: 100%;
    max-width: 420px;
    padding: 32px 28px 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(var(--shadow), 0.08);
}
h1 {
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
}
.subtitle {
    margin: 0 0 24px;
    font-size: 14px;
    color: var(--muted);
}
label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
}
.field { position: relative; }
input {
    width: 100%;
    padding: 13px 14px;
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
}
input::placeholder { color: var(--muted); opacity: .7; }
input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
}
#suggestionsList {
    display: none;
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 6px);
    z-index: 5;
    margin: 0; padding: 6px;
    list-style: none;
    max-height: 220px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 12px 28px rgba(var(--shadow), 0.12);
}
#suggestionsList li {
    display: flex;
    gap: 10px;
    padding: 9px 10px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
}
#suggestionsList li b { min-width: 68px; color: var(--accent-dark); font-weight: 500; }
#suggestionsList li:hover, #suggestionsList li.active { background: var(--accent-soft); }
button {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    transition: background .2s, transform .1s;
}
button:hover { background: var(--accent-dark); }
button:active { transform: scale(.98); }
button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.result { margin-top: 20px; }
.result:empty { display: none; }
.card {
    padding: 16px 18px;
    background: var(--accent-soft);
    border-radius: 14px;
    animation: pop .25s ease-out;
}
.card .clave { font-size: 13px; color: var(--accent-dark); font-weight: 500; }
.card .nombre { margin: 2px 0 12px; font-size: 18px; font-weight: 700; line-height: 1.25; }
.card .costo { font-size: 14px; color: var(--muted); }
.card .costo strong { color: var(--ink); font-size: 16px; }
.card.error { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }

button.ghost {
    margin-top: 10px;
    color: var(--accent-dark);
    background: transparent;
    border: 1px solid var(--line);
}
button.ghost:hover { background: var(--accent-soft); border-color: var(--accent); }
button.small { width: auto; margin: 14px 0 0; padding: 8px 14px; font-size: 13px; }
.form { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
.form[hidden] { display: none; }
.form h2 { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
.form input { margin-bottom: 14px; }
.form input[readonly] { color: var(--muted); cursor: not-allowed; }
.form .row { display: flex; gap: 10px; }
.form .row button { margin-top: 0; }
.form .msg { min-height: 18px; margin: 0 0 10px; font-size: 13px; color: var(--accent-dark); }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.card-actions button.small { margin: 0; }

body { background: radial-gradient(ellipse at 12% 8%, var(--accent-soft), transparent 45%), var(--bg); }
.container { position: relative; z-index: 1; }
.bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; color: var(--accent); }
.bg-dots { opacity: .10; }
.bg-wheel { position: absolute; color: var(--accent); overflow: visible; }
.bg-wheel.w1 { width: 520px; height: 520px; right: -170px; bottom: -190px; opacity: .10; }
.bg-wheel.w2 { width: 260px; height: 260px; left: -90px; top: -70px; opacity: .08; }
@media (max-width: 600px) {
    .bg-wheel.w1 { width: 360px; height: 360px; right: -140px; bottom: -120px; }
    .bg-wheel.w2 { width: 180px; height: 180px; left: -70px; top: -50px; }
}
button.danger { color: var(--muted); }
button.danger:hover { color: #fff; background: var(--accent); border-color: var(--accent); }
.confirm { margin-top: 14px; font-size: 14px; }
.confirm p { margin: 0 0 10px; }
.confirm .card-actions { margin-top: 0; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg class="bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
    <defs>
        <symbol id="wheel" viewBox="0 0 400 400">
            <g fill="none" stroke="currentColor">
                <circle cx="200" cy="200" r="190" stroke-width="7"/>
                <circle cx="200" cy="200" r="170" stroke-width="1.5"/>
                <circle cx="200" cy="200" r="16" stroke-width="3"/>
                <g stroke-width="1.2"><line x1="218.0" y1="200.0" x2="370.0" y2="200.0"/><line x1="216.7" y1="206.7" x2="357.6" y2="263.7"/><line x1="212.9" y1="212.5" x2="322.3" y2="318.1"/><line x1="207.3" y1="216.4" x2="269.1" y2="355.3"/><line x1="200.6" y1="218.0" x2="205.9" y2="369.9"/><line x1="193.8" y1="216.9" x2="141.9" y2="359.7"/><line x1="188.0" y1="213.4" x2="86.2" y2="326.3"/><line x1="183.8" y1="207.9" x2="47.2" y2="274.5"/><line x1="182.0" y1="201.3" x2="30.4" y2="211.9"/><line x1="182.9" y1="194.4" x2="38.3" y2="147.5"/><line x1="186.2" y1="188.4" x2="69.8" y2="90.7"/><line x1="191.5" y1="184.1" x2="120.2" y2="49.9"/><line x1="198.1" y1="182.1" x2="182.2" y2="30.9"/><line x1="205.0" y1="182.7" x2="246.9" y2="36.6"/><line x1="211.1" y1="185.8" x2="304.7" y2="66.0"/><line x1="215.6" y1="191.0" x2="347.2" y2="115.0"/><line x1="217.8" y1="197.5" x2="368.3" y2="176.3"/></g>
            </g>
        </symbol>
        <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.2" fill="currentColor"/>
        </pattern>
    </defs>
    <rect class="bg-dots" width="100%" height="100%" fill="url(#dots)"/>
    <svg class="bg-wheel w1" viewBox="0 0 400 400"><use href="#wheel"/></svg>
    <svg class="bg-wheel w2" viewBox="0 0 400 400"><use href="#wheel"/></svg>
</svg>

<main class="container">
    <h1>Inventario Nahel 2K24</h1>
    <p class="subtitle">Busca un producto por su clave o nombre.</p>

    <label for="product-key">Clave del producto</label>
    <div class="field">
        <input type="text" id="product-key" placeholder="Ej. CA398" autocomplete="off" oninput="showSuggestions()">
        <ul id="suggestionsList"></ul>
    </div>
    <button onclick="searchProduct()">Buscar producto</button>
    <div id="result" class="result" aria-live="polite"></div>
    <button class="ghost" id="addBtn" onclick="openForm()">Agregar producto</button>

    <form id="productForm" class="form" hidden onsubmit="saveProduct(event)">
        <h2 id="formTitle">Agregar producto</h2>
        <label for="f-clave">Clave</label>
        <input type="text" id="f-clave" autocomplete="off" required>
        <label for="f-nombre">Nombre</label>
        <input type="text" id="f-nombre" autocomplete="off" required>
        <label for="f-costo">Costo ($)</label>
        <input type="number" id="f-costo" min="0" step="0.01" value="0" required>
        <p class="msg" id="formMsg" role="alert"></p>
        <div class="row">
            <button type="submit">Guardar</button>
            <button type="button" class="ghost" onclick="closeForm()">Cancelar</button>
        </div>
    </form>
</main>

<script>
const productos = [
    { clave: "TA220", nombre: "TAZA TELESCOPIO AMERICANA", costo: 0 },
    { clave: "TA230", nombre: "TAZA TELESCOPIO ESTANDAR", costo: 0 },
    { clave: "RU035", nombre: "RUEDA LATERAL 12-20", costo: 0 },
    { clave: "RU030", nombre: "RUEDA LATERAL 12-20 NAHEL", costo: 0 },
    { clave: "RU007", nombre: "RUEDA LATERAL 16 NAHEL", costo: 0 },
    { clave: "RU002-4", nombre: "RUEDA LATERAL 12 NAHEL", costo: 0 },
    { clave: "CA398", nombre: "CAMARA 12 BICI", costo: 0 },
    { clave: "CA399", nombre: "CAMARA 16 BICI", costo: 0 },
    { clave: "CA400", nombre: "CAMARA 20 BICI", costo: 0 },
    { clave: "CA409", nombre: "CAMARA 24 BICI", costo: 0 },
    { clave: "CA410", nombre: "CAMARA 26 BICI", costo: 0 },
    { clave: "CA470", nombre: "CAMARA 18 BICI", costo: 0 },
    { clave: "CA700", nombre: "CAMARA 29 BICI", costo: 0 },
    { clave: "CA723", nombre: "CAMARA 17 MOTO", costo: 0 },
    { clave: "CA725", nombre: "CAMARA 18 MOTO", costo: 0 },
    { clave: "PA345", nombre: "CAJA PARCHE 24pzs", costo: 0 },
    { clave: "PA348", nombre: "CAJA PARCHE 48pzs", costo: 0 },
    { clave: "AS829", nombre: "ASIENTO COLORES CHICHO", costo: 0 },
    { clave: "AS155", nombre: "ASIENTO COLORES GRANDE", costo: 0 },
    { clave: "DE145", nombre: "DESVIADOR CON PATA", costo: 0 },
    { clave: "DE158", nombre: "DESVIADOR SIN PATA", costo: 0 },
    { clave: "PI120", nombre: "PIÑON 7 PASOS", costo: 0 },
    { clave: "PI115", nombre: "PIÑON 6 PASOS", costo: 0 },
    { clave: "PI030", nombre: "PIÑON 18 DIENTES", costo: 0 },
    { clave: "PI018", nombre: "PIÑON 16 DIENTES", costo: 0 },
    { clave: "PE174", nombre: "PEDAL 1/2", costo: 0 },
    { clave: "PE215", nombre: "PEDAL 9/16", costo: 0 },
    { clave: "LL435", nombre: "LLANTA 26 REFORZADA", costo: 0 },
    { clave: "LL421", nombre: "LLANTA 26 ECONOMICA", costo: 0 },
    { clave: "LL288E", nombre: "LLANTA 24", costo: 0 },
    { clave: "LL209", nombre: "LLANTA 20 MONTAÑA", costo: 0 },
    { clave: "LL180", nombre: "LLANTA 20 GALACTICA", costo: 0 },
    { clave: "LL070", nombre: "LLANTA 16", costo: 0 },
    { clave: "LL002-6H", nombre: "LLANTA 12", costo: 0 },
    { clave: "CE049", nombre: "CEMENTOS", costo: 0 },
    { clave: "BO090", nombre: "BOTE PARCHE", costo: 0 },
    { clave: "BO075", nombre: "BOTE PARCHE", costo: 0 },
    { clave: "BO012-3", nombre: "BOMBA CHICA", costo: 0 },
    { clave: "BO012-5", nombre: "BOMBA MEDIANA", costo: 0 },
    { clave: "BO012-7", nombre: "BOMBA GRANDE", costo: 0 },
    { clave: "CA778", nombre: "CANDADO BICI", costo: 0 },
    { clave: "CA775", nombre: "CANDADO MOTO", costo: 0 },
    { clave: "AH025", nombre: "AHORCADOR CHICO", costo: 0 },
    { clave: "AH030", nombre: "AHORCADOR GRANDE", costo: 0 },
    { clave: "TU098", nombre: "TUERCA TRASERA", costo: 0 },
    { clave: "BA190", nombre: "BALERO TRASERO", costo: 0 },
    { clave: "BA145", nombre: "BALERO DELANTERO", costo: 0 },
    { clave: "BA112", nombre: "CENTRO ESTÁNDAR", costo: 0 },
    { clave: "BA155", nombre: "TELESCOPIO", costo: 0 },
    { clave: "BA114", nombre: "CENTRO AMERICANO", costo: 0 },
    { clave: "CA070", nombre: "CABLE TRASERO FRENO", costo: 0 },
    { clave: "CA035", nombre: "CABLE DESVIADOR", costo: 0 },
    { clave: "CA010", nombre: "CABLE DE CLUTCH", costo: 0 },
    { clave: "FR160", nombre: "FRENO CANGREJO", costo: 0 },
    { clave: "FR166", nombre: "FRENO V-BRAKE", costo: 0 },
    { clave: "CA303", nombre: "CADENA CARRERAS", costo: 0 },
    { clave: "CA304", nombre: "CADENA ESTÁNDAR", costo: 0 },
    { clave: "LI085", nombre: "LLANTA 18", costo: 0 },
    { clave: "PE355", nombre: "PERICO DE BOMBA", costo: 0 },
    { clave: "TA080", nombre: "TAPÓN TARRAJA", costo: 0 },
];

const STORAGE_KEY = "nahel-productos";
try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (Array.isArray(saved)) productos.splice(0, productos.length, ...saved);
} catch (e) {}
function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(productos)); } catch (e) {}
}
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const input = document.getElementById("product-key");
const list = document.getElementById("suggestionsList");
const resultado = document.getElementById("result");
const form = document.getElementById("productForm");
const addBtn = document.getElementById("addBtn");
const fClave = document.getElementById("f-clave");
const fNombre = document.getElementById("f-nombre");
const fCosto = document.getElementById("f-costo");
const formMsg = document.getElementById("formMsg");
let editing = null;

function searchProduct() {
    const clave = input.value.trim().toUpperCase();
    list.style.display = "none";
    if (!clave) { resultado.innerHTML = ""; return; }

    const producto = productos.find(p => p.clave === clave);
    resultado.innerHTML = producto
        ? `<div class="card">
               <div class="clave">${esc(producto.clave)}</div>
               <div class="nombre">${esc(producto.nombre)}</div>
               <div class="costo">Costo <strong>$${Number(producto.costo).toFixed(2)}</strong></div>
               <div class="card-actions">
                   <button class="ghost small" onclick="openForm('${esc(producto.clave)}')">Modificar</button>
                   <button class="ghost small" onclick="goHome()">Volver al inicio</button>
                   <button class="ghost small danger" onclick="askDelete('${esc(producto.clave)}')">Eliminar</button>
               </div>
           </div>`
        : `<div class="card error">No encontramos "${esc(clave)}". Revisa la clave o agrégala como producto nuevo.</div>`;
}

function showSuggestions() {
    const q = input.value.trim().toUpperCase();
    list.innerHTML = "";
    if (!q) { list.style.display = "none"; return; }

    const matches = productos.filter(p =>
        p.clave.startsWith(q) || p.nombre.toUpperCase().startsWith(q)
    );
    if (!matches.length) { list.style.display = "none"; return; }

    matches.forEach(p => {
        const li = document.createElement("li");
        li.innerHTML = `<b>${esc(p.clave)}</b><span>${esc(p.nombre)}</span>`;
        li.onclick = () => { input.value = p.clave; searchProduct(); };
        list.appendChild(li);
    });
    list.style.display = "block";
}

function askDelete(clave) {
    const actions = resultado.querySelector(".card-actions");
    actions.outerHTML = `<div class="confirm">
        <p>¿Eliminar este producto? No se puede deshacer.</p>
        <div class="card-actions">
            <button class="small" onclick="deleteProduct('${esc(clave)}')">Sí, eliminar</button>
            <button class="ghost small" onclick="searchProduct()">Cancelar</button>
        </div>
    </div>`;
}

function deleteProduct(clave) {
    const i = productos.findIndex(p => p.clave === clave);
    if (i === -1) return;
    productos.splice(i, 1);
    persist();
    input.value = "";
    list.style.display = "none";
    resultado.innerHTML = `<div class="card error">Se eliminó ${esc(clave)}.</div>`;
}

function goHome() {
    closeForm();
    input.value = "";
    resultado.innerHTML = "";
    list.style.display = "none";
    input.focus();
}

function openForm(clave) {
    editing = clave ? productos.find(p => p.clave === clave) : null;
    document.getElementById("formTitle").textContent = editing ? "Modificar producto" : "Agregar producto";
    fClave.value = editing ? editing.clave : "";
    fClave.readOnly = !!editing;
    fNombre.value = editing ? editing.nombre : "";
    fCosto.value = editing ? editing.costo : 0;
    formMsg.textContent = "";
    form.hidden = false;
    addBtn.hidden = true;
    (editing ? fNombre : fClave).focus();
}

function closeForm() {
    form.hidden = true;
    addBtn.hidden = false;
    editing = null;
}

function saveProduct(e) {
    e.preventDefault();
    const clave = fClave.value.trim().toUpperCase();
    const nombre = fNombre.value.trim().toUpperCase();
    const costo = parseFloat(fCosto.value);
    if (!clave || !nombre || isNaN(costo) || costo < 0) {
        formMsg.textContent = "Completa todos los campos con valores válidos.";
        return;
    }
    if (editing) {
        editing.nombre = nombre;
        editing.costo = costo;
    } else {
        if (productos.some(p => p.clave === clave)) {
            formMsg.textContent = "Esa clave ya existe. Búscala para modificarla.";
            return;
        }
        productos.push({ clave, nombre, costo });
    }
    persist();
    closeForm();
    input.value = clave;
    searchProduct();
}

input.addEventListener("keydown", e => { if (e.key === "Enter") searchProduct(); });
document.addEventListener("click", e => { if (!e.target.closest(".field")) list.style.display = "none"; });
</script>

</body>
</html>
